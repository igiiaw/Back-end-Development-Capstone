apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: djangoserver
  template:
    metadata:
      labels:
        app: djangoserver
    spec:
      containers:
        - name: djangoserver
          image: backend-capstone:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: django-settings
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    app: djangoserver
  ports:
    - port: 8000
      targetPort: 8000
